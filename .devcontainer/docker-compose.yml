services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      - go-mod-cache:/root/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres

volumes:
  go-mod-cache:
  go-build-cache:
